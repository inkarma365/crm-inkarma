# Reverse proxy per crm.inkarma.it (da applicare come root / in CloudPanel su il server di sviluppo).
# Un solo dominio, instradamento per percorso:
#   /portale, /api/portale/*  → Hub (area clienti)        127.0.0.1:33010
#   /webhooks/*               → chiuso dall'esterno (Twenty chiama l'Hub sulla rete Docker interna)
#   tutto il resto            → Twenty (CRM interno)        127.0.0.1:33000
# Certificato: Let's Encrypt gestito da CloudPanel (o certbot). Le porte 330xx restano su 127.0.0.1.

server {
    listen 80;
    listen [::]:80;
    server_name crm.inkarma.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.inkarma.it;

    # ssl_certificate / ssl_certificate_key: inseriti da CloudPanel (Let's Encrypt).

    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;

    location ^~ /webhooks/ {
        return 404;
    }

    location = /portale { proxy_pass http://127.0.0.1:33010; }
    location ^~ /portale/ { proxy_pass http://127.0.0.1:33010; }
    location ^~ /api/portale/ { proxy_pass http://127.0.0.1:33010; }

    location / {
        proxy_pass http://127.0.0.1:33000;
        # Twenty usa connessioni persistenti (aggiornamenti in tempo reale)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Richiesto una volta nel blocco http {} (se non già presente in CloudPanel):
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
