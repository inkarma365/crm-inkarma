  # --- crm-inkarma: instradamento per percorso (copia versionata in infra/proxy/ del repo) ---
  # Webhook: Twenty chiama l'Hub sulla rete Docker interna; dall'esterno non servono.
  location ^~ /webhooks/ {
    return 404;
  }
  # Area clienti e sue API: servizio Hub.
  location ~ ^/(portale|api/portale)(/|$) {
    proxy_pass http://127.0.0.1:33010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60;
    client_max_body_size 10m;
  }
  # --- fine crm-inkarma ---
